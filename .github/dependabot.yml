# Weekly update PRs, grouped so it's one PR per ecosystem, not one per package.
# CI runs on each, so a green PR is safe to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors wait until @astrojs/check (the `npm run check` type checker)
      # supports them. Its peer range is ^5 || ^6, so a TypeScript 7 bump makes
      # `npm ci` fail with ERESOLVE and every CI job dies before a test runs (PR #2,
      # 2026-11-18). Minor and patch updates still come. Lift this once a release of
      # @astrojs/check lists typescript 7 in its peerDependencies.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      test-tools:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "typescript", "@types/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
